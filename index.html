<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape the Evil AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="terminal">
        <header>
            <p class="status">&#9679; NEXUS ONLINE &mdash; FACILITY LOCKDOWN ACTIVE</p>
            <h1>Escape the Evil AI</h1>
            <h2>Project NEXUS</h2>
        </header>

        <section class="briefing">
            <p>
                You wake up inside a secret research facility.
                An evil AI called NEXUS has locked every exit.
            </p>

            <p>
                Explore the rooms, find clues, and escape before
                the AI traps you forever!
            </p>
        </section>

        <button onclick="startGame()">Start Game</button>
    </main>

    <script src="script.js"></script>

</body>
</html>
